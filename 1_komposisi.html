<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>1. Komposisi Pegawai (Interaktif)</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#eef2f7;padding:20px;color:#1e293b}
.dashboard{max-width:1350px;margin:0 auto}
.main-header{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;padding:25px 30px;border-radius:14px;margin-bottom:25px;box-shadow:0 10px 25px rgba(0,0,0,.15)}
.main-header h1{font-size:22px;font-weight:700}
.main-header p{font-size:14px;opacity:.8;margin-top:5px}
.data-section{background:#fff;border-radius:14px;padding:25px;box-shadow:0 10px 30px rgba(0,0,0,.06)}

/* TABLE STYLE */
.table-container{overflow-x:auto;margin-bottom:25px;border-radius:8px;border:1px solid #e2e8f0}
table{width:100%;border-collapse:collapse;text-align:center;font-size:12px}
thead th{padding:10px 8px;font-weight:700;font-size:11px;text-transform:uppercase;color:#fff;border-right:1px solid rgba(255,255,255,.15)}
thead th:last-child{border-right:none}
/* Warna Header */
.h-q,.h-b,.h-tot{background:#dc2626}
.h-ssi{background:#2563eb}
.h-jst{background:#7c3aed}
.h-jst-sub{background:#9333ea}
.h-jst-sub2{background:#a855f7}
.h-glo{background:#16a34a}
.h-mag{background:#d97706}
.h-diff{background:#facc15;color:#1e293b}

tbody td{padding:10px 8px;border-bottom:1px solid #e2e8f0;color:#334155;text-align:center; white-space: nowrap;}
tbody tr:nth-child(even){background:#f8fafc}
.total-cell{font-weight:800;background:#f1f5f9}

/* Baris Total Jan-Nov */
.row-total-akumulatif { background: #e2e8f0 !important; font-weight: 800; border-top: 2px solid #94a3b8; }
.row-total-akumulatif td { color: #0f172a; padding: 12px 8px;}

/* HIGHLIGHT BOX */
.highlight-box{background:#f0f9ff;border-left:5px solid #0284c7;border-radius:8px;padding:20px;margin-top:20px;box-shadow:0 4px 10px rgba(0,0,0,.03)}
.highlight-box h4{font-size:15px;font-weight:800;margin-bottom:12px;color:#1e293b}
.highlight-content{font-size:13.5px;line-height:1.8;color:#1e293b}
.highlight-content .p-1{margin-bottom:10px;}
.highlight-content .p-2{margin-top:15px; margin-bottom:15px; padding-top:10px; border-top:1px dashed #cbd5e1;}
.highlight-content .p-3{font-weight:600;}
.highlight-content .desc-list{margin-top:5px; font-size:12.5px;}
.highlight-content .desc-list div{margin-bottom:3px;}
.mini-table{float:right; width:320px; margin-left:15px; margin-bottom:10px; border-collapse:collapse; font-size:12px;}
.mini-table th, .mini-table td{border:1px solid #cbd5e1; padding:6px 10px; text-align:center; color:#1e293b; white-space:normal;}
.mini-table th{background:#f1f5f9; font-weight:700;}
.mini-table .bg-red{background:#dc2626; color:#fff; border-color:#dc2626;}
.mini-table .bg-blue{background:#2563eb; color:#fff; border-color:#2563eb;}
.mini-table .bg-green{background:#16a34a; color:#fff; border-color:#16a34a;}
.mini-table .row-red{background:#fee2e2; font-weight:bold;}
.clear{clear:both;}

/* CHART GRID */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.chart-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:15px;box-shadow:0 4px 10px rgba(0,0,0,.02)}
.chart-card h3{font-size:13px;font-weight:700;margin-bottom:15px;color:#475569;text-align:center}
.canvas-container{position:relative;height:320px}
</style>
</head>
<body>
<div class="dashboard">
    <div class="main-header">
        <h1>1. Komposisi Pegawai</h1>
        <p>Update Data: <b>20 November 2026</b> | PT. Swadharma Sarana Informatika</p>
    </div>
    <div class="data-section">
        <div id="dataContent"></div>
    </div>
</div>

<script>
function fNum(num) { return num.toLocaleString('id-ID'); }

// Data Komposisi Lengkap
var komposisiData = [
{q:'I', b:'Jan', ssi:454, jstLama:4261, jstPeng:60, jstNon:15, jstProj:0, glo:333, dika:60, total:5183, diff:-62},
{q:'I', b:'Feb', ssi:447, jstLama:4334, jstPeng:57, jstNon:0, jstProj:192, glo:332, dika:51, total:5413, diff:230},
{q:'I', b:'Mar', ssi:519, jstLama:4621, jstPeng:23, jstNon:18, jstProj:25, glo:332, dika:53, total:5591, diff:178},
{q:'II', b:'April', ssi:515, jstLama:4422, jstPeng:27, jstNon:16, jstProj:14, glo:332, dika:58, total:5384, diff:-207},
{q:'II', b:'Mei', ssi:514, jstLama:4424, jstPeng:29, jstNon:17, jstProj:8, glo:332, dika:47, total:5371, diff:-13},
{q:'II', b:'Juni', ssi:514, jstLama:4423, jstPeng:36, jstNon:1, jstProj:8, glo:332, dika:45, total:5359, diff:-12},
{q:'III', b:'Juli', ssi:521, jstLama:4390, jstPeng:38, jstNon:3, jstProj:29, glo:332, dika:41, total:5354, diff:-5},
{q:'III', b:'Agustus', ssi:523, jstLama:4435, jstPeng:54, jstNon:8, jstProj:12, glo:332, dika:41, total:5405, diff:51},
{q:'III', b:'September', ssi:528, jstLama:4461, jstPeng:41, jstNon:12, jstProj:60, glo:332, dika:41, total:5475, diff:70},
{q:'IV', b:'Oktober', ssi:535, jstLama:4588, jstPeng:33, jstNon:2, jstProj:28, glo:332, dika:41, total:5559, diff:84},
{q:'IV', b:'November', ssi:535, jstLama:4595, jstPeng:17, jstNon:14, jstProj:21, glo:332, dika:41, total:5555, diff:-4}
];

// Detail Project per Bulan (Untuk Tooltip Interaktif)
var projectDetails = {
    'Jan': '-',
    'Feb': 'Mayoritas: Project Bank Mandiri (150+), Bank Jateng, CDM BRI, CR FLM BSI, CIT Bank Sumut, CIT Alfamart, CM PT ICS.',
    'Mar': 'CM PT ICS, CR FLM BSI, Bank BNI, Project Mandiri, CR FLM BSI, CDM BRI, Bank Jateng.',
    'April': 'Project Bank Mandiri, CM PT ICS, CR FLM Bank Nagari, CR FLM BNI, CPC Bank Mas.',
    'Mei': 'CM PT ICS, CR FLM BPD Jateng, Project Bank Mandiri, CR FLM BSI.',
    'Juni': 'Project Bank Mandiri, CR FLM BSI, CM PT ICS.',
    'Juli': 'Project Kolaborasi CR-FLM BSI, Bank NTB Syariah, KDMP.',
    'Agustus': 'Project Kolaborasi CR-FLM BSI, KDMP, Bank NTB.',
    'September': 'Project Kolaborasi CR-FLM BSI, CR FLM BSI, KDMP.',
    'Oktober': 'Project BSI, KDMP, Bank NTB.',
    'November': 'Project Kolaborasi CR-FLM BSI, CR FLM Bank NTB Syariah, Project KDMP.'
};

// Hitung Total Akumulatif Jan-Nov
var totalPeng = 0, totalNon = 0, totalProj = 0;
komposisiData.forEach(function(d) {
    totalPeng += d.jstPeng;
    totalNon += d.jstNon;
    totalProj += d.jstProj;
});
var totalPegawaiBaru = totalNon + totalProj;

var tbl = '';
komposisiData.forEach(function(r, i) {
    var isNewQ = (i === 0 || komposisiData[i-1].q !== r.q);
    var rowSpan = komposisiData.filter(d => d.q === r.q).length;
    var hl = (r.b === 'November') ? 'style="background:#fffbeb;font-weight:bold;"' : '';
    tbl += '<tr ' + hl + '>';
    if(isNewQ) tbl += '<td rowspan="'+rowSpan+'" style="font-weight:bold;background:#f1f5f9;">'+r.q+'</td>';
    tbl += '<td>'+r.b+'</td>';
    tbl += '<td>'+fNum(r.ssi)+'</td>';
    tbl += '<td>'+fNum(r.jstLama)+'</td><td>'+fNum(r.jstPeng)+'</td><td>'+fNum(r.jstNon)+'</td><td>'+fNum(r.jstProj)+'</td>';
    tbl += '<td>'+fNum(r.glo)+'</td><td>'+fNum(r.dika)+'</td>';
    tbl += '<td class="total-cell">'+fNum(r.total)+'</td>';
    tbl += '<td style="color:'+(r.diff>=0?'#16a34a':'#dc2626')+'; font-weight:bold;">'+(r.diff>=0?'+':'')+fNum(r.diff)+'</td>';
    tbl += '</tr>';
});

// Tambahkan Baris Total Akumulatif di Bawah Tabel
tbl += `
    <tr class="row-total-akumulatif">
        <td colspan="4">TOTAL AKUMULATIF (JAN - NOV)</td>
        <td style="color:#b45309;">${fNum(totalPeng)}</td>
        <td style="color:#2563eb;">${fNum(totalNon)}</td>
        <td style="color:#7c3aed;">${fNum(totalProj)}</td>
        <td colspan="4"></td>
    </tr>
`;

var content = `
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="h-q" rowspan="3">Quartal</th>
                    <th class="h-b" rowspan="3">Bulan</th>
                    <th class="h-ssi" rowspan="3">SSI</th>
                    <th class="h-jst" colspan="4">JST</th>
                    <th class="h-glo" rowspan="3">GLO</th>
                    <th class="h-mag" rowspan="3">DIKA</th>
                    <th class="h-tot" rowspan="3">Total</th>
                    <th class="h-diff" rowspan="3">+/-</th>
                </tr>
                <tr>
                    <th class="h-jst-sub" rowspan="2">Lama</th>
                    <th class="h-jst-sub" rowspan="2">Pengganti</th>
                    <th class="h-jst-sub2" colspan="2">Baru</th>
                </tr>
                <tr>
                    <th class="h-jst-sub2">Non</th>
                    <th class="h-jst-sub2">Project</th>
                </tr>
            </thead>
            <tbody>${tbl}</tbody>
        </table>
    </div>

    <!-- CHART GRID -->
    <div class="chart-grid">
        <div class="chart-card">
            <h3>📈 Tren Total Pegawai</h3>
            <div class="canvas-container"><canvas id="chartTrendPeg"></canvas></div>
        </div>
        <div class="chart-card">
            <h3>📊 Kurva Pertumbuhan Pegawai Baru (Non-Project vs Project)</h3>
            <div class="canvas-container"><canvas id="chartNewEmp"></canvas></div>
        </div>
    </div>
    
    <div class="highlight-box">
        <h4>📌 Highlight :</h4>
        <div class="highlight-content">
            <table class="mini-table">
                <tr><th>Indikator</th><th class="bg-red">SSI</th><th class="bg-blue">JST</th><th class="bg-green">Total</th></tr>
                <tr><td>Pegawai masuk</td><td>5</td><td>193</td><td>198</td></tr>
                <tr><td>Pegawai keluar</td><td>6</td><td>196</td><td>202</td></tr>
                <tr class="row-red"><td>Selisih (-/+)</td><td>-1</td><td>-3</td><td>-4</td></tr>
            </table>
            <div class="p-1">
                Komposisi pegawai SSI dan Alih Daya Q-4 s.d <b>20 November 2026</b> mengalami penurunan sebanyak <b>-4 orang</b> menjadi <b>5.555 orang</b> dibandingkan bulan Oktober 2026 (turun sekitar 0,07%).
                <div class="desc-list" style="margin-top:10px;">
                    <div style="margin-bottom: 8px;">
                        <i>- Pegawai SSI (Out)</i> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;: <b style="color:#dc2626;">- 6 Orang</b>, (2) Org Undur diri; (1) Orang Jeda; (1) Pensiun Dini; (2) Alihdaya.
                    </div>
                    <div style="margin-bottom: 8px;">
                        <i>- Pegawai JST (Out)</i> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;: <b style="color:#dc2626;">- 196 Orang</b>, (142) Org Jeda; (35) Org Undur diri; (18) Org Tidak Diperpanjang; (1) Org MD.
                    </div>
                    <div style="margin-bottom: 8px;">
                        <i>- Pegawai JST (IN)</i> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;: <b style="color:#16a34a;">+ 193 Orang</b>, (141) Org New Jeda; (17) Org Pengganti; (14) Org New Non-Project; (21) Org New Project (Kolaborasi CR-FLM BSI, Bank NTB Syariah, KDMP).
                    </div>
                    <div>
                        <i>- Pegawai SSI (IN)</i> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;: <b style="color:#16a34a;">+ 5 Orang</b> New Jeda;
                    </div>
                </div>
            </div>
            <div class="clear"></div>
            
            <!-- NARASI DIKOREKSI (PENGGANTI DIHAPUS DARI NARASI PERTUMBUHAN) -->
            <div class="p-2">
                <b>Analisa Akumulatif Pegawai Baru (Jan - Nov 2026):</b><br>
                Selama kurun waktu Januari s.d November 2026, total penambahan **Pegawai Baru Non-Project** mencapai <b>${fNum(totalNon)} orang</b>, dan penambahan **Pegawai Baru Project** mencapai <b>${fNum(totalProj)} orang</b>. Sehingga total keseluruhan penambahan pegawai baru (Non-Project + Project) selama kurang lebih 11 bulan ini adalah sebanyak <b>${fNum(totalPegawaiBaru)} Orang</b>.
            </div>
            <div class="p-3">
                Berdasarkan data Komposisi Pegawai dari <b>Januari s.d November 2026</b>, terjadi penambahan total pegawai (keseluruhan) sebesar <b>+372 orang</b> atau tumbuh <b>+7,18%</b>.
            </div>
        </div>
    </div>
`;
document.getElementById('dataContent').innerHTML = content;

setTimeout(() => {
    var labelsBulan = komposisiData.map(d=>d.b);
    
    // 1. Chart Total Pegawai
    new Chart(document.getElementById('chartTrendPeg'), { 
        type: 'line', 
        data: { labels: labelsBulan, datasets: [{ label: 'Total Pegawai', data: komposisiData.map(d=>d.total), borderColor: '#1e3a8a', backgroundColor: 'rgba(30,58,138,0.1)', borderWidth: 3, tension: 0.4, fill: true, pointRadius: 4 }] }, 
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } 
    });
    
    // 2. Chart Pegawai Baru (Non vs Project) dengan Tooltip Interaktif
    new Chart(document.getElementById('chartNewEmp'), {
        type: 'line',
        data: {
            labels: labelsBulan,
            datasets: [
                {
                    label: 'Non-Project',
                    data: komposisiData.map(d=>d.jstNon),
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    borderWidth: 3, tension: 0.4, fill: true, pointRadius: 5
                },
                {
                    label: 'Project',
                    data: komposisiData.map(d=>d.jstProj),
                    borderColor: '#f97316',
                    backgroundColor: 'rgba(249, 115, 22, 0.1)',
                    borderWidth: 3, tension: 0.4, fill: true, pointRadius: 5
                }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { 
                legend: { position: 'top' },
                tooltip: {
                    backgroundColor: 'rgba(15, 23, 42, 0.95)',
                    titleFont: { size: 14 },
                    bodyFont: { size: 13 },
                    padding: 15,
                    cornerRadius: 8,
                    callbacks: {
                        label: function(context) {
                            let label = context.dataset.label || '';
                            if (label) { label += ': '; }
                            if (context.parsed.y !== null) { label += context.parsed.y + ' Orang'; }
                            return label;
                        },
                        afterLabel: function(context) {
                            if (context.dataset.label === 'Project') {
                                let month = context.label;
                                let details = projectDetails[month];
                                if (details && details !== '-') {
                                    return 'Detail: ' + details;
                                }
                            }
                            return '';
                        }
                    }
                }
            },
            scales: { 
                y: { beginAtZero: true, grid: { color: '#f1f5f9' } }, 
                x: { grid: { display: false } } 
            }
        }
    });

}, 100);
</script>
</body>
</html>
