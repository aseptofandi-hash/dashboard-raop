<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>5. PKWT Pegawai</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#eef2f7;padding:20px;color:#1e293b}
.dashboard{max-width:1200px;margin:0 auto}
.main-header{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;padding:25px 30px;border-radius:14px;margin-bottom:25px;box-shadow:0 10px 25px rgba(0,0,0,.15)}
.main-header h1{font-size:22px;font-weight:700}
.main-header p{font-size:14px;opacity:.8;margin-top:5px}
.data-section{background:#fff;border-radius:14px;padding:25px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.table-container{overflow-x:auto;margin-bottom:25px;border-radius:8px;border:1px solid #e2e8f0}
table{width:100%;border-collapse:collapse;text-align:center;font-size:13px}
thead th{padding:12px 8px;font-weight:700;font-size:11px;text-transform:uppercase;color:#fff;border-right:1px solid rgba(255,255,255,.15)}
thead th:last-child{border-right:none}
.h-q,.h-tot{background:#94a3b8}.h-glo{background:#16a34a}.h-ssi{background:#dc2626}
tbody td{padding:10px 8px;border-bottom:1px solid #e2e8f0;color:#334155;text-align:center}
tbody tr:nth-child(even){background:#f8fafc}
tbody tr:last-child{font-weight:bold; background:#f1f5f9; border-top:2px solid #cbd5e1;}
.status-done{color:#2563eb;font-weight:bold}
.status-prog{color:#dc2626;font-weight:bold}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.chart-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:15px}
.chart-card h3{font-size:13px;font-weight:700;margin-bottom:15px;color:#475569;text-align:center}
.canvas-container{position:relative;height:280px}

/* STYLE HIGHLIGHT KHUSUS NO. 5 */
.highlight-box{background:#fffbeb;border-left:5px solid #f59e0b;border-radius:8px;padding:20px;margin-top:20px;box-shadow:0 4px 10px rgba(0,0,0,.03)}
.highlight-box h4{font-size:15px;font-weight:800;margin-bottom:15px;color:#1e293b}
.highlight-content{font-size:13.5px;line-height:1.7;color:#1e293b;}
.highlight-content p { margin-bottom: 10px; }
.highlight-content b { color: #0f172a; }
.highlight-content .target-box { background: #fff; padding: 15px; border-radius: 8px; border: 1px dashed #fcd34d; margin-top: 15px;}
</style>
</head>
<body>
<div class="dashboard">
    <div class="main-header">
        <h1>5. Progress Penyelesaian PKWT Karyawan SSI dan Alih Daya (JST)</h1>
        <p>Update per <b>13 November 2026</b> | PT. Swadharma Sarana Informatika</p>
    </div>
    <div class="data-section">
        <div id="dataContent"></div>
    </div>
</div>

<script>
// Data Update 13 November 2026
var pkwtData = [
    { reg:'PUSAT', total:34, done:9, prog:25, pDone:'26,47%', pProg:'73,53%' },
    { reg:'REG-1', total:126, done:33, prog:93, pDone:'26,19%', pProg:'73,81%' },
    { reg:'REG-2', total:149, done:90, prog:59, pDone:'60,40%', pProg:'39,60%' },
    { reg:'REG-3', total:351, done:251, prog:100, pDone:'71,51%', pProg:'28,49%' },
    { reg:'REG-4', total:141, done:16, prog:125, pDone:'11,35%', pProg:'88,65%' },
    { reg:'REG-5', total:110, done:61, prog:49, pDone:'55,45%', pProg:'44,55%' },
    { reg:'REG-6', total:126, done:85, prog:41, pDone:'67,46%', pProg:'32,54%' },
    { reg:'REG-7', total:177, done:51, prog:126, pDone:'28,81%', pProg:'71,19%' },
    { reg:'REG-8', total:62, done:23, prog:39, pDone:'37,10%', pProg:'62,90%' },
    { reg:'REG-9', total:82, done:43, prog:39, pDone:'52,44%', pProg:'47,56%' },
    { reg:'REG-10', total:79, done:31, prog:48, pDone:'39,24%', pProg:'60,76%' }
];

var tblPkwt = '';
pkwtData.forEach(function(r) {
    tblPkwt += `<tr>
        <td style="font-weight:bold;">${r.reg}</td>
        <td>${r.total}</td>
        <td class="status-done">${r.done}</td>
        <td class="status-done">${r.pDone}</td>
        <td class="status-prog">${r.prog}</td>
        <td class="status-prog">${r.pProg}</td>
    </tr>`;
});

var content = `
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="h-q" rowspan="2">Region</th>
                    <th class="h-tot" rowspan="2">Total November 2026</th>
                    <th class="h-glo" colspan="2">DONE</th>
                    <th class="h-ssi" colspan="2">ON-PROGRESS</th>
                </tr>
                <tr>
                    <th class="h-glo">SSI/JST</th>
                    <th class="h-glo">SSI/JST</th>
                    <th class="h-ssi">SSI/JST</th>
                    <th class="h-ssi">SSI/JST</th>
                </tr>
            </thead>
            <tbody>
                ${tblPkwt}
                <tr>
                    <td>TOTAL</td>
                    <td>1.437</td>
                    <td class="status-done">693</td>
                    <td class="status-done">48,23%</td>
                    <td class="status-prog">744</td>
                    <td class="status-prog">51,77%</td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="chart-grid">
        <div class="chart-card"><h3>🍩 Rasio Penyelesaian PKWT</h3><div class="canvas-container"><canvas id="chartPkwt"></canvas></div></div>
        <div class="chart-card"><h3>📊 Status PKWT Per Region</h3><div class="canvas-container"><canvas id="chartPkwtBar"></canvas></div></div>
    </div>
    
    <div class="highlight-box">
        <h4>📌 Highlight :</h4>
        <div class="highlight-content">
            <p><b>1. Capaian Keseluruhan:</b> Dari total <b>1.437 karyawan</b> yang masuk proses PKWT bulan ini, sebanyak <b>693 karyawan (48,23%)</b> telah berstatus <b>DONE</b> (Selesai). Sisa <b>744 karyawan (51,77%)</b> masih berstatus <b>ON-PROGRESS</b>.</p>
            <p><b>2. Region Terbaik:</b> <b>REG-3</b> memimpin dengan progress penyelesaian tertinggi mencapai <b>71,51%</b> (251 dari 351 karyawan). Disusul oleh <b>REG-6 (67,46%)</b> dan <b>REG-2 (60,40%)</b>.</p>
            <p><b>3. Region Perhatian Khusus:</b> <b>REG-4</b> menjadi region dengan progress terendah, baru mencapai <b>11,35% Done</b> (hanya 16 dari 141 karyawan). Diikuti oleh <b>REG-1 (26,19%)</b> dan <b>PUSAT (26,47%)</b>.</p>
            
            <div class="target-box">
                <b>🎯 Target Penyelesaian:</b> Mengingat batas waktu penyelesaian adalah <b>tanggal 20 November 2026</b> (H-5 sebelum realisasi gaji), sisa 7 hari harus dimaksimalkan untuk mengejar penyelesaian 744 karyawan, dengan fokus eskalasi khusus pada REG-4.
            </div>
        </div>
    </div>
`;
document.getElementById('dataContent').innerHTML = content;

setTimeout(() => {
    // Donat: 693 Done (Hijau), 744 On-Progress (Merah)
    new Chart(document.getElementById('chartPkwt'), { 
        type: 'doughnut', 
        data: { labels: ['Done (693)', 'On-Progress (744)'], datasets: [{ data: [693, 744], backgroundColor: ['#16a34a', '#dc2626'], borderWidth: 4, borderColor: '#fff' }] }, 
        options: { responsive: true, maintainAspectRatio: false, cutout: '60%', plugins: { legend: { position: 'bottom' } } } 
    });

    // Grafik Batang: Menampilkan batang Hijau (Done) dan Merah (On-Progress) per Region
    new Chart(document.getElementById('chartPkwtBar'), { 
        type: 'bar', 
        data: { 
            labels: pkwtData.map(d=>d.reg), 
            datasets: [
                { label: 'Done', data: pkwtData.map(d=>d.done), backgroundColor: '#16a34a', borderRadius: 4 }, 
                { label: 'On-Progress', data: pkwtData.map(d=>d.prog), backgroundColor: '#dc2626', borderRadius: 4 }
            ] 
        }, 
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } }, scales: { x: { stacked: true }, y: { stacked: true } } } 
    });
}, 100);
</script>
</body>
</html>
